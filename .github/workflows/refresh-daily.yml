name: Refresh daily content
on:
  schedule:
    - cron: "15 9 * * *" # 09:15 UTC, after the Orthodox calendar day has rolled over
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run daily
      - name: Commit if changed
        run: |
          git config user.name "daily-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add public/daily.json
          git diff --staged --quiet || (git commit -m "Refresh daily reading and thought" && git push)
