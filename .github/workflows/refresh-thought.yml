name: Refresh thought of the day
on:
  schedule:
    - cron: "15 9 * * *" # 09:15 UTC daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run thought
      - name: Commit if changed
        run: |
          git config user.name "daily-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add public/thought.json
          git diff --staged --quiet || (git commit -m "Refresh thought of the day" && git push)
